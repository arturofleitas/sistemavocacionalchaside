<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Vocacional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #1e40af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card p-4">
                    <div class="text-center mb-4">
                        <h3 class="text-primary">Sistema Vocacional CHASIDE</h3>
                        <p class="text-muted">Iniciar Sesión</p>
                    </div>

                    <!-- Mensajes de error o éxito -->
                    <div th:if="${param.error}" class="alert alert-danger text-center">
                        Usuario o contraseña incorrectos
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success text-center">
                        Has cerrado sesión correctamente
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success text-center">
                        ¡Registro exitoso! Ahora puedes iniciar sesión
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">Ingresar</button>
                    </form>

                    <!-- Enlace de registro para estudiantes -->
                    <div class="text-center">
                        <p class="mb-0">
                            ¿No tienes cuenta? 
                            <a href="/registrarse" class="text-primary fw-semibold">
                                Regístrate como Estudiante
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
