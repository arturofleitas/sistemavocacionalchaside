<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Sistema Vocacional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #1e40af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 1.5rem 0;
        }

        .card {
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 2rem 1.25rem;
        }

        @media (max-width: 576px) {
            .card {
                padding: 2rem 1rem;
            }
            .form-control {
                font-size: 16px;
                padding: 12px 14px;
            }
            .form-label {
                font-size: 14px;
            }
            .btn {
                font-size: 16px;
                padding: 12px;
            }
            .alert {
                font-size: 0.95rem;
                padding: 0.5rem 0.75rem;
            }
        }

        @media (min-width: 577px) and (max-width: 992px) {
            .card {
                padding: 2.5rem 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-10 col-md-8 col-lg-6">
                <div class="card">
                    <h3 class="text-center mb-4 text-primary" style="font-size: clamp(1.5rem, 5vw, 2.2rem);">
                        <i class="fas fa-user-plus me-2"></i> Crear Cuenta de Estudiante
                    </h3>

                    <div th:if="${error}" class="alert alert-danger text-center py-2 px-3" style="font-size: 0.95rem;" th:text="${error}"></div>

                    <form th:action="@{/registrarse}" th:object="${usuario}" method="post">
                        <div class="row g-3">
                            <!-- Nombre y Apellido -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Nombre</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required placeholder="Tu nombre">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Apellido</label>
                                <input type="text" class="form-control" th:field="*{apellido}" required placeholder="Tu apellido">
                            </div>

                            <!-- Fecha de Nacimiento -->
                            <div class="col-12">
                                <label class="form-label fw-semibold">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" th:field="*{fecha_nacimiento}" required>
                            </div>

                            <!-- Username -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Usuario (username)</label>
                                <input type="text" class="form-control" th:field="*{username}" required placeholder="Elige un nombre de usuario">
                            </div>

                            <!-- Contraseña -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Contraseña</label>
                                <input type="password" class="form-control" th:field="*{password}" required placeholder="Mínimo 6 caracteres">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 py-sm-3 mt-4 mb-3 fw-semibold">
                            <i class="fas fa-user-plus me-2"></i> Registrarse como Estudiante
                        </button>
                    </form>

                    <div class="text-center">
                        <a href="/login" class="text-primary fw-semibold d-block py-2" style="font-size: 1.05rem;">
                            <i class="fas fa-sign-in-alt me-1"></i> ¿Ya tienes cuenta? Inicia sesión
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
