<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Sistema Vocacional</title>

    <!-- Bootstrap, Font Awesome y estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/registro.css} + '?v=' + ${#dates.createNow().getTime()}">
</head>

<body>

    <div class="register-card">
        <!-- Cabecera: logo FACITEC junto al título -->
        <div class="register-header">
            <img th:src="@{/img/LogoFacitec.jpg}" alt="FACITEC - Universidad Nacional de Canindeyú" class="reg-logo">
            <h3><i class="fas fa-user-plus me-2"></i> Crear Cuenta de Estudiante</h3>
        </div>

        <!-- Error de validación -->
        <div th:if="${error}" class="alert alert-danger text-center py-2 px-3" th:text="${error}"></div>

        <form th:action="@{/registrarse}" th:object="${usuario}" method="post">
            <div class="row g-3">
                <!-- Nombre y Apellido -->
                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required placeholder="Tu nombre">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Apellido</label>
                    <input type="text" class="form-control" th:field="*{apellido}" required placeholder="Tu apellido">
                </div>

                <!-- Fecha de Nacimiento -->
                <div class="col-12">
                    <label class="form-label">Fecha de Nacimiento</label>
                    <input type="date" class="form-control" th:field="*{fecha_nacimiento}" required>
                </div>

                <!-- Username -->
                <div class="col-md-6">
                    <label class="form-label">Usuario (username)</label>
                    <input type="text" class="form-control" th:field="*{username}" required placeholder="Elige un nombre de usuario">
                </div>

                <!-- Contraseña -->
                <div class="col-md-6">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" th:field="*{password}" required minlength="5" placeholder="Mínimo 5 caracteres">
                </div>
            </div>

            <button type="submit" class="btn-register mt-4">
                <i class="fas fa-user-plus me-2"></i> Registrarse como Estudiante
            </button>
        </form>

        <div class="register-login">
            ¿Ya tenés cuenta?
            <a th:href="@{/login}"><i class="fas fa-sign-in-alt me-1"></i> Inicia sesión</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
