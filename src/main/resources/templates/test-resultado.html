<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Diagnóstico Vocacional Personalizado</title>
	<link rel="stylesheet" th:href="@{/css/home.css}">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<style>
		.diagnostico-card {
			background: linear-gradient(145deg, #ffffff 0%, #f8f9ff 100%);
			border-radius: 40px;
			box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.15);
			padding: 2rem;
			margin: 2rem auto;
			max-width: 850px;
		}

		.badge-perfil {
			font-size: 1.8rem;
			padding: 0.5rem 1.5rem;
			border-radius: 50px;
		}

		.icono-perfil {
			font-size: 4rem;
			color: #0d6efd;
		}
	</style>
</head>

<body>
	<div class="main-container">
		<div class="sidebar"><!-- igual --></div>
		<div class="content p-4">
			<div class="diagnostico-card">
				<div class="text-center">
					<i class="fas fa-brain icono-perfil"></i>
					<h1 class="display-5 fw-bold mt-2">Informe Vocacional</h1>
					<p class="lead">Basado en el test CHASIDE</p>
					<hr class="w-25 mx-auto">
				</div>

				<div class="text-center my-4">
					<span class="badge bg-primary badge-perfil" th:text="${categoriaGanadora}"></span>
					<h3 class="mt-3">Tu perfil psicológico vocacional</h3>
				</div>

				<div class="p-3 bg-light rounded-4">
					<p th:text="${descripcion}" class="fs-5"></p>
				</div>

				<div class="alert alert-info mt-4" role="alert">
					<i class="fas fa-lightbulb"></i> Este diagnóstico es una guía. Tu vocación se construye con
					experiencia, reflexión y asesoramiento profesional.
				</div>

				<div class="text-center mt-4 no-print">
					<a th:href="@{/home}" class="btn btn-primary">Volver al Inicio</a>
					<a th:href="@{/realizar-test}" class="btn btn-outline-primary ms-2">Realizar nuevo test</a>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
