<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del Test - CHASIDE</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <!-- Sidebar dinámico -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h4><i class="fas fa-clipboard-check"></i> Sistema Vocacional</h4>
            </div>
            <ul class="nav flex-column">
                <li><a th:href="@{/home}"><i class="fas fa-home"></i> Inicio</a></li>
                <li sec:authorize="hasAnyRole('ADMIN', 'ESTUDIANTE')">
                    <a th:href="@{/realizar-test}"><i class="fas fa-play-circle"></i> Realizar Test</a>
                </li>
                <li class="mt-auto"><a href="/logout"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
            </ul>
        </div>

        <div class="content p-4">
            <h2 class="text-center mb-4">¡Tu Perfil Vocacional CHASIDE!</h2>

            <div class="row">
                <div class="col-md-8 mx-auto">
                    <div class="card shadow" style="border-radius: 20px;">
                        <div class="card-body p-4">
                            <h4 class="text-center mb-4">Puntajes por área</h4>
                            <div class="row g-3" th:each="entry : ${ranking}">
                                <div class="col-12">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <strong th:text="${entry.key}"></strong>
                                        <span th:text="${entry.value} + ' puntos'"></span>
                                    </div>
                                    <div class="progress mt-2" style="height: 12px;">
                                        <div class="progress-bar bg-primary" th:style="'width: ' + (${entry.value} * 100 / ${totalPreguntas}) + '%'"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="alert alert-info mt-4 text-center">
                        <h5>Tus áreas más fuertes:</h5>
                        <p th:each="entry : ${ranking}" th:if="${entry.value >= 10}">
                            <strong th:text="${entry.key}"></strong> con <span th:text="${entry.value}"></span> puntos
                        </p>
                    </div>

                    <div class="text-center mt-4">
                        <a th:href="@{/home}" class="btn btn-primary">Volver al Inicio</a>
                        <a th:href="@{/realizar-test}" class="btn btn-outline-primary ms-2">Hacer el test nuevamente</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
