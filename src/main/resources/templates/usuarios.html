<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">

    <title>Gestión de Usuarios - Sistema Vocacional</title>

    <!-- Meta tags para evitar caché del navegador -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">

    <!-- SweetAlert2 CSS para alertas profesionales -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <!-- Estilos globales del sistema -->
    <link rel="stylesheet"
          th:href="@{/css/home.css} + '?v=' + ${#dates.createNow().getTime()}">

    <!-- Estilos específicos de usuarios (Aquí ya se encuentra el CSS optimizado) -->
    <link rel="stylesheet"
          th:href="@{/css/usuarios.css} + '?v=' + ${#dates.createNow().getTime()}">
</head>

<body>

    <div class="main-container">

        <!-- Sidebar reutilizado -->
        <div th:replace="~{fragments/menu :: sidebar}"></div>

        <!-- Contenido principal -->
        <div class="content" id="pagina-usuarios">

            <!-- Cabecera principal -->
            <div class="header no-print">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="btn btn-primary d-md-none no-print"
                            type="button"
                            data-bs-toggle="offcanvas"
                            data-bs-target="#offcanvasMenu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2>Gestión de Usuarios</h2>
                </div>

                <div class="user-info no-print">
                    <span>
                        Bienvenido,
                        <strong sec:authentication="name"></strong>
                    </span>
                    <div class="avatar">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </div>

            <!-- Offcanvas para el menú móvil -->
            <div th:replace="~{fragments/menu :: offcanvas}"></div>

            <!-- Mensaje de error -->
            <div th:if="${error}"
                 class="alert alert-danger alert-dismissible fade show no-print"
                 role="alert">
                <strong>
                    <i class="fas fa-exclamation-triangle"></i>
                    Error:
                </strong>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Filas: formulario a la izquierda, tabla a la derecha -->
            <div class="row g-4">

                <!-- Columna izquierda: formulario -->
                <div class="col-lg-5 no-print">
                    <div class="form-card p-4">
                        <h5 class="mb-3 text-primary" th:if="${usuario.id == null || usuario.id == 0}">
                            Nuevo Usuario
                        </h5>
                        <h5 class="mb-3 text-primary" th:if="${usuario.id != null && usuario.id > 0}">
                            Editar Usuario
                        </h5>

                        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label class="form-label small">Nombre</label>
                                    <input type="text" class="form-control form-control-sm" th:field="*{nombre}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small">Apellido</label>
                                    <input type="text" class="form-control form-control-sm" th:field="*{apellido}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small">Fecha de Nacimiento</label>
                                    <input type="date" class="form-control form-control-sm" th:field="*{fecha_nacimiento}" required>
                                </div>
                            </div>

                            <hr class="my-2">

                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label class="form-label small">Username</label>
                                    <input type="text" class="form-control form-control-sm" th:field="*{username}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small">Rol</label>
                                    <select class="form-select form-select-sm" th:field="*{rol}" required>
                                        <option value="ESTUDIANTE">ESTUDIANTE</option>
                                        <option value="ADMIN">ADMIN</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small">Contraseña</label>
                                    <input type="password" class="form-control form-control-sm" th:field="*{password}" required>
                                    <small class="text-muted" style="font-size: 10px;">Mínimo 6 caracteres</small>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small">Estado</label>
                                    <select class="form-select form-select-sm" th:field="*{estado}" required>
                                        <option th:value="true">Activo</option>
                                        <option th:value="false">Inactivo</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-3 no-print">
                                <button type="button" class="btn btn-secondary btn-sm flex-fill" onclick="window.location.href='/usuarios'">
                                    Cancelar
                                </button>
                                <button type="submit" class="btn btn-primary btn-sm flex-fill">
                                    Guardar Usuario
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Columna derecha: tabla -->
                <div class="col-lg-7 columna-tabla-derecha">
                    <div class="table-card">
                        <div class="p-3 border-bottom bg-light d-flex justify-content-between align-items-center no-print">
                            <h5 class="mb-0 text-primary">Usuarios Registrados</h5>
                            <div class="d-flex gap-2">
                                <button onclick="window.print();" class="btn btn-sm btn-outline-primary no-print">
                                    <i class="fas fa-print me-1"></i> Imprimir
                                </button>
                                <a th:href="@{/usuarios}" class="btn btn-sm btn-primary no-print">
                                    <i class="fas fa-plus"></i> Nuevo
                                </a>
                            </div>
                        </div>

                        <!-- Barra de filtros -->
                        <div class="filter-bar no-print">
                            <div class="row g-2 align-items-end">
                                <div class="col-md-4">
                                    <label for="searchNombre" class="form-label small">Nombre / Apellido</label>
                                    <input type="text" id="searchNombre" class="form-control form-control-sm" placeholder="Ej: Juan Pérez">
                                </div>
                                <div class="col-md-3">
                                    <label for="searchUsername" class="form-label small">Username</label>
                                    <input type="text" id="searchUsername" class="form-control form-control-sm" placeholder="Nombre de usuario">
                                </div>
                                <div class="col-md-3">
                                    <label for="filterRol" class="form-label small">Rol</label>
                                    <select id="filterRol" class="form-select form-select-sm">
                                        <option value="">Todos</option>
                                        <option value="ESTUDIANTE">Estudiante</option>
                                        <option value="ADMIN">Administrador</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <button id="resetFilters" class="btn btn-outline-secondary btn-sm w-100 no-print">Limpiar</button>
                                </div>
                            </div>
                        </div>

                        <!-- Contenedor responsivo con scroll -->
                        <div class="table-responsive scrollable-table">
                            <table class="table table-sm table-hover mb-0 align-middle" id="tablaUsuarios">
                                <thead class="table-light">
                                    <tr>
                                        <th class="th-nro">Nº</th>
                                        <th>Nombre completo</th>
                                        <th class="th-username">Username</th>
                                        <th class="th-rol">Rol</th>
                                        <th class="th-estado">Estado</th>
                                        <th class="text-center no-print th-acciones">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="usuariosBody">
                                    <tr th:if="${usuarios.isEmpty()}">
                                        <td colspan="6" class="text-center py-4 text-muted">
                                            <i class="fas fa-inbox fa-2x mb-2"></i><br>
                                            No hay usuarios registrados.
                                        </td>
                                    </tr>

                                    <!-- Iteramos con 'iterStat' para generar un número correlativo (1, 2, 3...) -->
                                    <tr th:each="u, iterStat : ${usuarios}"
                                        th:attr="data-nombre=${u.nombre + ' ' + u.apellido},
                                                 data-username=${u.username},
                                                 data-rol=${u.rol}">
                                        <!-- Mostramos el número de orden secuencial -->
                                        <td class="fw-bold text-muted th-nro" th:text="${iterStat.count}"></td>
                                        <td th:text="${u.nombre + ' ' + u.apellido}"></td>
                                        <td class="th-username text-truncate" th:text="${u.username}"></td>
                                        <td class="th-rol">
                                            <span th:if="${u.rol == 'ADMIN'}" class="badge bg-danger">ADMIN</span>
                                            <span th:if="${u.rol == 'ESTUDIANTE'}" class="badge bg-success">ESTUDIANTE</span>
                                        </td>
                                        <td class="th-estado">
                                            <span th:if="${u.estado}" class="badge bg-success">Activo</span>
                                            <span th:unless="${u.estado}" class="badge bg-secondary">Inactivo</span>
                                        </td>

                                        <!-- Acciones -->
                                        <td class="text-center no-print text-nowrap th-acciones">
                                            <!-- Botón para editar usuario -->
                                            <a th:href="@{/usuarios/editar/{id}(id=${u.id})}"
                                               class="btn btn-sm btn-outline-primary me-1"
                                               title="Editar usuario">
                                                <i class="fas fa-edit"></i>
                                            </a>

                                            <!-- Botón dinámico con alerta SweetAlert -->
                                            <button type="button"
                                                    class="btn btn-sm btn-alternar-estado"
                                                    th:classappend="${u.estado != null && u.estado} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                    th:data-id="${u.id}"
                                                    th:data-nombre="${u.nombre + ' ' + u.apellido}"
                                                    th:data-estado="${u.estado != null && u.estado}"
                                                    th:title="${u.estado != null && u.estado} ? 'Desactivar usuario' : 'Activar usuario'">
                                                <i class="fas" th:classappend="${u.estado != null && u.estado} ? 'fa-ban' : 'fa-check'"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Script principal de usuarios -->
    <script th:src="@{/js/usuarios.js}"></script>

</body>
</html>
