<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport corregida para evitar zoom en iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Gestión de Usuarios - Sistema Vocacional</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>
<body>

    <div class="app-container" id="appContainer">

        <!-- Sidebar -->
        <div th:replace="fragments/menu :: sidebar"></div>

        <!-- Contenido principal -->
        <main class="main-content" id="pagina-usuarios">

            <!-- Cabecera -->
            <header class="header">
                <div class="header-left">
                    <button class="menu-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <button class="btn-toggle-sidebar d-none d-md-inline-block" type="button" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2>Gestión de Usuarios</h2>
                </div>
                <div class="user-info">
                    <span>Bienvenido, <strong sec:authentication="name"></strong></span>
                    <div class="avatar"><i class="fas fa-user"></i></div>
                </div>
            </header>

            <!-- Offcanvas (móvil) -->
            <div th:replace="fragments/menu :: offcanvas"></div>

            <!-- Mensajes de error -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong><i class="fas fa-exclamation-triangle"></i> Error:</strong> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Formulario (se usará con Thymeleaf o se renderizará con JS) -->
            <section class="form-card">
                <h5 th:if="${usuario.id == null || usuario.id == 0}">Nuevo Usuario</h5>
                <h5 th:if="${usuario.id != null && usuario.id > 0}">Editar Usuario</h5>

                <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required>
                        </div>
                        <div class="form-group">
                            <label>Apellido</label>
                            <input type="text" class="form-control" th:field="*{apellido}" required>
                        </div>
                        <div class="form-group">
                            <label>Fecha de Nacimiento</label>
                            <input type="date" class="form-control" th:field="*{fecha_nacimiento}" required>
                        </div>
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" class="form-control" th:field="*{username}" required>
                        </div>
                        <div class="form-group">
                            <label>Rol</label>
                            <select class="form-select" th:field="*{rol}" required>
                                <option value="ESTUDIANTE">ESTUDIANTE</option>
                                <option value="ADMIN">ADMIN</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Contraseña</label>
                            <input type="password" class="form-control" th:field="*{password}" required>
                            <small>Mínimo 6 caracteres</small>
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select class="form-select" th:field="*{estado}" required>
                                <option th:value="true">Activo</option>
                                <option th:value="false">Inactivo</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='/usuarios'">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Usuario</button>
                    </div>
                </form>
            </section>

            <!-- Tabla de usuarios -->
            <section class="table-card">
                <div class="table-header">
                    <h5>Usuarios Registrados</h5>
                    <div class="table-toolbar">
                        <button onclick="window.print();" class="btn btn-sm btn-outline-secondary">
                            <i class="fas fa-print"></i> Imprimir
                        </button>
                        <a th:href="@{/usuarios}" class="btn btn-sm btn-primary">
                            <i class="fas fa-plus"></i> Nuevo
                        </a>
                    </div>
                </div>

                <div class="filter-bar">
                    <div class="filter-row">
                        <input type="text" id="searchNombre" placeholder="Buscar por nombre..." class="form-control form-control-sm">
                        <input type="text" id="searchUsername" placeholder="Username..." class="form-control form-control-sm">
                        <select id="filterRol" class="form-select form-select-sm">
                            <option value="">Todos los roles</option>
                            <option value="ESTUDIANTE">Estudiante</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                        <button id="resetFilters" class="btn btn-outline-secondary btn-sm">Limpiar</button>
                    </div>
                </div>

                <div class="table-responsive-wrapper">
                    <table class="table table-hover table-sm">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre completo</th>
                                <th>Username</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usuariosBody">
                            <tr th:if="${usuarios.isEmpty()}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <i class="fas fa-inbox fa-2x d-block mb-2"></i>No hay usuarios registrados.
                                </td>
                            </tr>
                            <tr th:each="u : ${usuarios}" 
                                th:attr="data-nombre=${u.nombre + ' ' + u.apellido},
                                     data-username=${u.username},
                                     data-rol=${u.rol}">
                                <td th:text="${u.id}"></td>
                                <td th:text="${u.nombre + ' ' + u.apellido}"></td>
                                <td th:text="${u.username}"></td>
                                <td>
                                    <span th:if="${u.rol == 'ADMIN'}" class="badge bg-danger">ADMIN</span>
                                    <span th:if="${u.rol == 'ESTUDIANTE'}" class="badge bg-success">ESTUDIANTE</span>
                                </td>
                                <td>
                                    <span th:if="${u.estado}" class="badge bg-success">Activo</span>
                                    <span th:unless="${u.estado}" class="badge bg-secondary">Inactivo</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-outline-primary me-1">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('¿Eliminar este usuario?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/usuarios.js}"></script>
    <script>
        function toggleSidebar() {
            var container = document.getElementById('appContainer');
            container.classList.toggle('sidebar-collapsed');
            var isCollapsed = container.classList.contains('sidebar-collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);
        }

        window.addEventListener('load', function() {
            var container = document.getElementById('appContainer');
            var collapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (collapsed) {
                container.classList.add('sidebar-collapsed');
            }
        });

        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                document.body.style.display = 'none';
                document.body.offsetHeight;
                document.body.style.display = '';
            }
        });
    </script>
</body>
</html>
