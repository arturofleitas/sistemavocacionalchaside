<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gestión de Test - Sistema Vocacional</title>

	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />

	<!-- SweetAlert2 CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

	<link rel="stylesheet" th:href="@{/css/home.css} + '?v=' + ${#dates.createNow().getTime()}">
	<link rel="stylesheet" th:href="@{/css/gestion-test.css} + '?v=' + ${#dates.createNow().getTime()}">
	<link rel="stylesheet" th:href="@{/css/gestion.css} + '?v=' + ${#dates.createNow().getTime()}">
</head>

<body th:attr="data-abrir-modal=${abrirModal != null && abrirModal ? 'true' : 'false'}">
	<div class="main-container">

		<div th:replace="~{fragments/menu :: sidebar}"></div>

		<div class="content">

			<div class="header">
				<div style="display: flex; align-items: center; gap: 12px;">
					<button class="btn btn-primary d-md-none no-print" type="button" data-bs-toggle="offcanvas"
						data-bs-target="#offcanvasMenu">
						<i class="fas fa-bars"></i>
					</button>
					<button class="btn-toggle-sidebar d-none d-md-inline-block" type="button" title="Mostrar/ocultar menú">
						<i class="fas fa-bars"></i>
					</button>
					<h2 class="header-title">Gestión de Test</h2>
				</div>
				<div th:replace="~{fragments/menu :: userInfo}"></div>
			</div>

			<div th:replace="~{fragments/menu :: offcanvas}"></div>

			<div th:if="${error}" class="alert alert-danger alert-dismissible fade show no-print" role="alert">
				<strong><i class="fas fa-exclamation-triangle"></i> Error:</strong> <span th:text="${error}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<!-- Tabla de tests (ocupa todo el ancho del contenido) -->
			<div class="col-12 columna-tabla-derecha px-0">
				<div class="table-card">

					<div class="p-3 border-bottom bg-light d-flex justify-content-between align-items-center flex-wrap gap-2 no-print cabecera-tabla">
						<h5 class="mb-0 text-primary titulo-tabla">Tests Registrados</h5>
						<div class="d-flex gap-2">
							<button type="button" id="btnNuevoTest" class="btn btn-primary btn-mas"
								data-bs-toggle="tooltip" data-bs-placement="bottom" title="Agregar test">
								<i class="fas fa-plus"></i>
							</button>
							<button onclick="window.print();" class="btn btn-outline-primary">
								<i class="fas fa-print me-1"></i> Imprimir
							</button>
						</div>
					</div>

					<!-- Barra de filtros -->
					<div class="filter-bar no-print">
						<div class="row g-2 g-md-3 align-items-end">
							<div class="col-12 col-md-4">
								<label for="filtroNombre" class="form-label">Nombre</label>
								<input type="text" id="filtroNombre" class="form-control"
									placeholder="Buscar por nombre">
							</div>
							<div class="col-12 col-md-4">
								<label for="filtroDescripcion" class="form-label">Descripción</label>
								<input type="text" id="filtroDescripcion" class="form-control"
									placeholder="Buscar por descripción">
							</div>
							<div class="col-6 col-md-2">
								<label for="filtroEstado" class="form-label">Estado</label>
								<select id="filtroEstado" class="form-select">
									<option value="">Todos</option>
									<option value="true">Activo</option>
									<option value="false">Inactivo</option>
								</select>
							</div>
							<div class="col-6 col-md-2">
								<button id="limpiarFiltros" class="btn btn-outline-secondary w-100">Limpiar</button>
							</div>
						</div>
					</div>

					<!-- Contenedor responsivo con scroll -->
					<div class="table-responsive contenedor-tabla-fisica" id="tablaTests">
						<table class="table table-hover mb-0 align-middle" id="tablaTestsBody">
							<thead class="table-light">
								<tr>
									<th class="th-nro text-center">Nº</th>
									<th>Nombre</th>
									<th class="col-descripcion">Descripción</th>
									<th class="th-estado text-center">Estado</th>
									<th class="text-center columna-acciones no-print th-acciones">Acciones</th>
								</tr>
							</thead>
							<tbody id="cuerpoTests">
								<tr th:if="${tests.isEmpty()}">
									<td colspan="5" class="text-center py-5 text-muted">
										<i class="fas fa-inbox fa-2x mb-2"></i><br>
										Aún no hay tests registrados.
									</td>
								</tr>

								<!-- Usamos iterStat para enumerar secuencialmente: 1, 2, 3... -->
								<tr th:each="t, iterStat : ${tests}"
									th:attr="data-id=${t.id},
									         data-nombre=${t.nombre},
									         data-descripcion=${t.descripcion},
									         data-estado=${t.estado}">

									<!-- Columna con número correlativo ordenado -->
									<td class="fw-bold text-muted th-nro text-center" th:text="${iterStat.count}"></td>
									<td th:text="${t.nombre}"></td>
									<td class="col-descripcion" th:text="${t.descripcion}"></td>
									<td class="th-estado text-center">
										<span class="badge text-badge-estado"
											th:classappend="${t.estado} ? 'bg-success' : 'bg-secondary'">
											<span th:text="${t.estado ? 'Activo' : 'Inactivo'}"></span>
										</span>
									</td>

									<!-- Acciones con iconos iguales a Usuarios -->
									<td class="text-center columna-acciones no-print text-nowrap th-acciones">
										<a href="#" th:attr="data-id=${t.id}"
											class="btn btn-sm btn-outline-primary me-1 btn-editar" title="Editar test">
											<i class="fas fa-edit"></i>
										</a>

										<button type="button" class="btn btn-sm btn-desactivar"
											th:classappend="${t.estado} ? 'btn-outline-danger' : 'btn-outline-success'"
											th:data-id="${t.id}" th:data-nombre="${t.nombre}"
											th:data-estado="${t.estado}"
											th:title="${t.estado ? 'Desactivar test' : 'Activar test'}">
											<i class="fas" th:classappend="${t.estado} ? 'fa-ban' : 'fa-check'"></i>
										</button>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Modal: formulario de test (nuevo / editar) -->
	<div class="modal fade" id="modalTest" tabindex="-1" aria-labelledby="tituloModalTest" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
			<div class="modal-content">
				<div class="modal-header py-2">
					<h5 class="modal-title text-primary fw-bold" id="tituloModalTest">
						<i class="fas fa-plus me-2"></i>Nuevo Test
					</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
				</div>
				<form id="formTest" th:action="@{/gestion-test/guardar}" th:object="${test}" method="post">
					<input type="hidden" th:field="*{id}">
					<div class="modal-body">
						<div class="mb-3">
							<label class="form-label">Nombre del Test</label>
							<input type="text" class="form-control form-control-sm" th:field="*{nombre}" required placeholder="Ej: Test Vocacional">
						</div>
						<div class="mb-3">
							<label class="form-label">Descripción</label>
							<textarea class="form-control form-control-sm" rows="2" th:field="*{descripcion}" placeholder="Breve descripción"></textarea>
						</div>
						<div class="mb-2">
							<label class="form-label">Estado</label>
							<select class="form-select form-select-sm" th:field="*{estado}" required>
								<option value="true">Activo</option>
								<option value="false">Inactivo</option>
							</select>
						</div>
					</div>
					<div class="modal-footer py-2">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
						<button type="submit" class="btn btn-primary">Guardar Test</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<button id="btnSubir" class="btn-flotante d-md-none" title="Volver arriba">
		<i class="fas fa-chevron-up"></i>
	</button>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<!-- SweetAlert2 JS -->
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<!-- Toggle del menú lateral (común a todas las interfaces) -->
	<script th:src="@{/js/sidebar.js}"></script>
	<script th:src="@{/js/gestion-test.js} + '?v=' + ${#dates.createNow().getTime()}"></script>
</body>

</html>
