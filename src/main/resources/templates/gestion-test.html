<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Test - Sistema Vocacional</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- NUEVO: Enlace a la hoja de estilos externa unificada -->
    <link rel="stylesheet" th:href="@{/css/gestion-test.css}">
    
    <style>
        .content { background: linear-gradient(135deg, #f0f7ff 0%, #e0f0ff 100%); min-height: 100vh; padding: 30px; }
        .form-card, .table-card { background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 10px 30px rgba(13,110,253,0.15); }
        .header-title { color: #1e40af; font-weight: 700; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Sidebar Azul - Reutilizado (Oculto al imprimir) -->
        <div class="sidebar no-print">
            <div class="sidebar-header">
				<h4><i class="fas fa-clipboard-check me-2"></i>Sistema Vocacional</h4>
            </div>
            <ul class="nav flex-column">
                <li><a th:href="@{/home}"><i class="fas fa-home"></i> Inicio</a></li>
                <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/usuarios}"><i class="fas fa-users"></i> Usuarios</a></li>
                <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/gestion-test}" class="active"><i class="fas fa-cogs"></i> Gestión de Test</a></li>
                <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/preguntas}"><i class="fas fa-question-circle"></i> Preguntas</a></li>
				<li sec:authorize="hasAnyRole('ADMIN','ESTUDIANTE')"><a th:href="@{/realizar-test}"><i class="fas fa-play-circle"></i> Realizar Test</a></li>
                <li sec:authorize="hasAnyRole('ADMIN','ESTUDIANTE')"><a th:href="@{/reportes}"><i class="fas fa-chart-bar"></i> Reportes</a></li>        
                <li class="mt-auto"><a href="/logout"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
            </ul>
		</div>

        <div class="content">
            <div class="d-flex justify-content-between align-items-center mb-4 header-seccion">
                <h2 class="header-title">Gestión de Test</h2>
                <div class="user-info no-print">
                    <span>Bienvenido, <span sec:authentication="name"></span></span>
                </div>
            </div>

            <div class="row g-4">
                <!-- Formulario (Oculto al imprimir) -->
                <div class="col-lg-5 columna-formulario-izquierda">
                    <div class="form-card p-4">
                        <h5 class="mb-4 text-primary" th:if="${test.id == null || test.id == 0}">Crear Nuevo Test</h5>
                        <h5 class="mb-4 text-primary" th:if="${test.id != null && test.id > 0}">Editar Test</h5>

                        <form th:action="@{/gestion-test/guardar}" th:object="${test}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label">Nombre del Test</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" rows="3" th:field="*{descripcion}"></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Estado</label>
                                <select class="form-select" th:field="*{estado}">
                                    <option value="true">Activo</option>
                                    <option value="false">Inactivo</option>
                                </select>
                            </div>

                            <div class="d-flex gap-3">
                                <button type="button" class="btn btn-secondary flex-fill" onclick="window.location.href='/gestion-test'">Cancelar</button>
                                <button type="submit" class="btn btn-primary flex-fill">Guardar Test</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Tabla (Se expande horizontalmente en la impresión) -->
                <div class="col-lg-7 columna-tabla-derecha">
                    <div class="table-card">
                        <div class="p-4 border-bottom bg-light d-flex justify-content-between align-items-center cabecera-tabla">
                            <h5 class="mb-0 text-primary titulo-tabla">Tests Registrados</h5>
                            <!-- NUEVO: Agrupación flex para el botón Imprimir junto a Nuevo Test -->
                            <div class="d-flex gap-2 no-print">
                                <button onclick="window.print();" class="btn btn-sm btn-outline-primary"><i class="fas fa-print me-1"></i>Imprimir</button>
                                <a th:href="@{/gestion-test}" class="btn btn-sm btn-primary"><i class="fas fa-plus"></i> Nuevo Test</a>
                            </div>
                        </div>

                        <div class="table-responsive contenedor-tabla-fisica">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Nombre</th>
                                        <th>Descripción</th>
                                        <th>Estado</th>
                                        <th class="text-center columna-acciones">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${tests.isEmpty()}">
                                        <td colspan="4" class="text-center py-5 text-muted">
                                            Aún no hay tests registrados
                                        </td>
                                    </tr>
                                    <tr th:each="t : ${tests}">
                                        <td th:text="${t.nombre}"></td>
                                        <td th:text="${t.descripcion}"></td>
                                        <td>
                                            <span class="badge text-badge-estado" th:classappend="${t.estado} ? 'bg-success' : 'bg-secondary'">
                                                <span th:text="${t.estado ? 'Activo' : 'Inactivo'}"></span>
                                            </span>
                                        </td>
                                        <td class="text-center columna-acciones">
                                            <a th:href="@{/gestion-test/editar/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary me-2">Editar</a>
                                            <a th:href="@{/gestion-test/eliminar/{id}(id=${t.id})}" 
                                               class="btn btn-sm btn-outline-danger"
                                               onclick="return confirm('¿Eliminar este test?')">Eliminar</a>
                                        </td>
                                    </tr>
                                </tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
