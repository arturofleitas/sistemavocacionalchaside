<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Test - Sistema Vocacional</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">

    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" 
          referrerpolicy="no-referrer" />

    <link rel="stylesheet" th:href="@{/css/home.css} + '?v=' + ${#dates.createNow().getTime()}">
    <link rel="stylesheet" th:href="@{/css/gestion-test.css} + '?v=' + ${#dates.createNow().getTime()}">
</head>

<body>
    <div class="main-container">

        <div th:replace="~{fragments/menu :: sidebar}"></div>

        <div class="content">

            <div class="header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="btn btn-primary d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 class="header-title">Gestión de Test</h2>
                </div>
                <div class="user-info">
                    <span>Bienvenido, <span sec:authentication="name"></span></span>
                </div>
            </div>

            <div th:replace="~{fragments/menu :: offcanvas}"></div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong><i class="fas fa-exclamation-triangle"></i> Error:</strong> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row g-4">

                <div class="col-lg-5 columna-formulario-izquierda no-print">
                    <div class="form-card p-4">
                        <h5 class="mb-4 text-primary" th:if="${test.id == null || test.id == 0}">Crear Nuevo Test</h5>
                        <h5 class="mb-4 text-primary" th:if="${test.id != null && test.id > 0}">Editar Test</h5>

                        <form th:action="@{/gestion-test/guardar}" th:object="${test}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label">Nombre del Test</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" rows="3" th:field="*{descripcion}"></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Estado</label>
                                <select class="form-select" th:field="*{estado}">
                                    <option value="true">Activo</option>
                                    <option value="false">Inactivo</option>
                                </select>
                            </div>

                            <div class="d-flex gap-3">
                                <button type="button" class="btn btn-secondary flex-fill" onclick="window.location.href='/gestion-test'">Cancelar</button>
                                <button type="submit" class="btn btn-primary flex-fill">Guardar Test</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="col-lg-7 columna-tabla-derecha">
                    <div class="table-card">

                        <div class="p-4 border-bottom bg-light d-flex justify-content-between align-items-center cabecera-tabla">
                            <h5 class="mb-0 text-primary titulo-tabla">Tests Registrados</h5>
                            <div class="d-flex gap-2 no-print">
                                <button onclick="window.print();" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-print me-1"></i>Imprimir
                                </button>
                                <a th:href="@{/gestion-test}" class="btn btn-sm btn-primary">
                                    <i class="fas fa-plus"></i> Nuevo Test
                                </a>
                            </div>
                        </div>

                        <!-- Barra de filtros (ahora dentro de la tarjeta, sobre la tabla) -->
                        <div class="filter-bar no-print">
                            <div class="row g-2 g-md-3 align-items-end">
                                <div class="col-12 col-md-4">
                                    <label for="filtroNombre" class="form-label">Nombre</label>
                                    <input type="text" id="filtroNombre" class="form-control" placeholder="Buscar por nombre">
                                </div>
                                <div class="col-12 col-md-4">
                                    <label for="filtroDescripcion" class="form-label">Descripción</label>
                                    <input type="text" id="filtroDescripcion" class="form-control" placeholder="Buscar por descripción">
                                </div>
                                <div class="col-6 col-md-2">
                                    <label for="filtroEstado" class="form-label">Estado</label>
                                    <select id="filtroEstado" class="form-select">
                                        <option value="">Todos</option>
                                        <option value="true">Activo</option>
                                        <option value="false">Inactivo</option>
                                    </select>
                                </div>
                                <div class="col-6 col-md-2">
                                    <button id="limpiarFiltros" class="btn btn-outline-secondary w-100">Limpiar</button>
                                </div>
                            </div>
                        </div>

                        <div class="table-responsive contenedor-tabla-fisica" id="tablaTests">
                            <table class="table table-hover mb-0" id="tablaTestsBody">
                                <thead class="table-light">
                                    <tr>
                                        <th>Nombre</th>
                                        <th class="col-descripcion">Descripción</th>
                                        <th>Estado</th>
                                        <th class="text-center columna-acciones no-print">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="cuerpoTests">
                                    <tr th:if="${tests.isEmpty()}">
                                        <td colspan="4" class="text-center py-5 text-muted">
                                            Aún no hay tests registrados
                                        </td>
                                    </tr>
                                    <tr th:each="t : ${tests}"
                                        th:attr="data-nombre=${t.nombre},
                                                 data-descripcion=${t.descripcion},
                                                 data-estado=${t.estado}">
                                        <td th:text="${t.nombre}"></td>
                                        <td class="col-descripcion" th:text="${t.descripcion}"></td>
                                        <td>
                                            <span class="badge text-badge-estado" th:classappend="${t.estado} ? 'bg-success' : 'bg-secondary'">
                                                <span th:text="${t.estado ? 'Activo' : 'Inactivo'}"></span>
                                            </span>
                                        </td>
                                        <td class="text-center columna-acciones no-print">
                                            <a th:href="@{/gestion-test/editar/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary me-1 me-md-2">
                                                <i class="fas fa-edit"></i> <span class="d-none d-sm-inline">Editar</span>
                                            </a>
                                            <button class="btn btn-sm btn-outline-danger btn-desactivar" 
                                                    data-id="${t.id}" 
                                                    data-nombre="${t.nombre}"
                                                    data-estado="${t.estado}">
                                                <i class="fas fa-toggle-off"></i>
                                                <span class="d-none d-sm-inline" th:text="${t.estado ? 'Desactivar' : 'Activar'}"></span>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button id="btnSubir" class="btn-flotante d-md-none" title="Volver arriba">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/gestion-test.js} + '?v=' + ${#dates.createNow().getTime()}"></script>
</body>
</html>
