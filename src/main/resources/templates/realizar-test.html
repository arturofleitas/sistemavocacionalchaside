<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Realizar Test - CHASIDE</title>

	<!-- Meta tags anti-caché -->

	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

	<meta http-equiv="Pragma" content="no-cache">

	<meta http-equiv="Expires" content="0">

	<!-- Bootstrap -->

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

	<!-- Font Awesome -->

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />

	<!-- home.css (estilos globales) -->

	<link rel="stylesheet" th:href="@{/css/home.css} + '?v=' + ${#dates.createNow().getTime()}">

	<!-- realizar-test.css (estilos específicos) -->

	<link rel="stylesheet" th:href="@{/css/realizar-test.css} + '?v=' + ${#dates.createNow().getTime()}">

</head>

<body>

	<div class="main-container">

		<!-- Sidebar reutilizable -->

		<div th:replace="~{fragments/menu :: sidebar}"></div>

		<!-- Contenido principal -->

		<div class="content">

			<!-- Header -->

			<div class="header">

				<div style="display: flex; align-items: center; gap: 12px;">

					<!-- Botón hamburguesa para móvil -->

					<button class="btn btn-primary d-md-none" type="button" data-bs-toggle="offcanvas"
						data-bs-target="#offcanvasMenu">

						<i class="fas fa-bars"></i>

					</button>

					<h2 class="header-title">Realizar Test Vocacional CHASIDE</h2>

				</div>

				<div class="user-info">

					<span>
						Bienvenido,
						<span sec:authentication="name"></span>
					</span>

				</div>

			</div>

			<!-- Offcanvas para móvil -->

			<div th:replace="~{fragments/menu :: offcanvas}"></div>

			<!-- Barra de progreso -->

			<div class="mb-4">

				<div class="d-flex justify-content-between mb-1">

					<span>
						Pregunta
						<strong th:text="${progreso}"></strong>
						de
						<strong th:text="${total}"></strong>
					</span>

					<span th:text="${progreso * 100 / total} + '%'"></span>

				</div>

				<div class="progress">

					<div class="progress-bar bg-primary" th:style="'width: ' + (${progreso} * 100 / ${total}) + '%'">
					</div>

				</div>

			</div>

			<!-- Tarjeta de pregunta -->

			<div class="question-card" id="questionCard">

				<h4 th:text="${pregunta.texto}"></h4>

				<!-- Alerta de validación (oculta inicialmente) -->

				<div id="alertaSeleccion" class="alert alert-warning alert-dismissible fade show mt-3" role="alert"
					style="display: none;">

					<i class="fas fa-exclamation-triangle me-2"></i>

					<strong>¡Atención!</strong>

					Para continuar, selecciona una respuesta (Sí o No) en la pregunta actual.

				</div>

				<!-- Formulario principal: se removió el onsubmit para manejarlo desde JS -->

				<form id="formTest" th:action="@{/realizar-test/responder}" method="post" class="mt-4">

					<!-- Opciones Sí / No -->

					<div class="opciones-container">

						<!-- Opción Sí -->

						<label class="opcion-card">


							<input type="radio" name="respuesta" value="SI" id="si">

							<div class="opcion-box">

								<div class="cuadrado-indicador"></div>

								<span class="opcion-texto">Sí</span>

							</div>

						</label>

						<!-- Opción No -->

						<label class="opcion-card">

							<input type="radio" name="respuesta" value="NO" id="no">

							<div class="opcion-box">

								<div class="cuadrado-indicador"></div>

								<span class="opcion-texto">No</span>

							</div>

						</label>

					</div>

					<!-- Botones de navegación -->

					<div class="d-flex justify-content-between mt-5">

						<span></span>

						<button type="button" class="btn btn-primary" th:if="${!esUltimaPregunta}" id="btnSiguiente">

							Siguiente →

						</button>

						<button type="submit" class="btn btn-success" th:if="${esUltimaPregunta}" id="btnFinalizar">

							Finalizar Test

						</button>

					</div>

				</form>

				<!-- Formulario para retroceder (independiente) -->

				<form th:if="${progreso > 1}" th:action="@{/realizar-test/anterior}" method="post"
					style="margin-top: -68px; width: fit-content;"
					onsubmit="this.querySelector('button').disabled = true;">

					<button type="submit" class="btn btn-secondary">

						← Anterior

					</button>

				</form>

			</div>

		</div>

	</div>

	<!-- Scripts -->

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<script th:src="@{/js/realizar-test.js} + '?v=' + ${#dates.createNow().getTime()}"></script>

</body>

</html>
