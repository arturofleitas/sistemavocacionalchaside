<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Test - CHASIDE</title>

    <!-- Meta tags anti-caché -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- 1. Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">

    <!-- 2. Font Awesome -->
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" 
          referrerpolicy="no-referrer" />

    <!-- 3. home.css (estilos globales) -->
    <link rel="stylesheet" th:href="@{/css/home.css} + '?v=' + ${#dates.createNow().getTime()}">

    <!-- 4. realizar-test.css (estilos específicos de esta página) -->
    <link rel="stylesheet" th:href="@{/css/realizar-test.css} + '?v=' + ${#dates.createNow().getTime()}">
</head>

<body>
    <div class="main-container">

        <!-- ===== SIDEBAR (escritorio) ===== -->
        <!-- Reutiliza el fragmento sidebar de menu.html -->
        <div th:replace="~{fragments/menu :: sidebar}"></div>

        <!-- ===== CONTENIDO PRINCIPAL ===== -->
        <div class="content">

            <!-- HEADER -->
            <div class="header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <!-- Botón hamburguesa (visible solo en móvil) para abrir el offcanvas -->
                    <button class="btn btn-primary d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 class="header-title">Realizar Test Vocacional CHASIDE</h2>
                </div>
                <div class="user-info">
                    <span>Bienvenido, <span sec:authentication="name"></span></span>
                </div>
            </div>

            <!-- ===== OFFCANVAS (móvil) ===== -->
            <!-- Reutiliza el fragmento offcanvas de menu.html -->
            <div th:replace="~{fragments/menu :: offcanvas}"></div>

            <!-- ===== BARRA DE PROGRESO ===== -->
            <div class="mb-4">
                <div class="d-flex justify-content-between mb-1">
                    <span>Pregunta <strong th:text="${progreso}"></strong> de <strong th:text="${total}"></strong></span>
                    <span th:text="${progreso * 100 / total} + '%'"></span>
                </div>
                <div class="progress">
                    <div class="progress-bar bg-primary" th:style="'width: ' + (${progreso} * 100 / ${total}) + '%'"></div>
                </div>
            </div>

            <!-- ===== TARJETA DE PREGUNTA ===== -->
            <div class="question-card">
                <h4 th:text="${pregunta.texto}"></h4>

                <!-- FORMULARIO PRINCIPAL: Siguiente / Finalizar -->
                <form th:action="@{/realizar-test/responder}" method="post" class="mt-4"
                      onsubmit="this.querySelector('button[type=submit]').disabled = true; return true;">

                    <!-- Opciones (Sí / No) -->
                    <div class="opciones-container">
                        <!-- Opción Sí -->
                        <label class="opcion-card">
                            <input type="radio" name="respuesta" value="SI" id="si" required>
                            <div class="opcion-box">
                                <div class="cuadrado-indicador"></div>
                                <span class="opcion-texto">Sí</span>
                            </div>
                        </label>

                        <!-- Opción No -->
                        <label class="opcion-card">
                            <input type="radio" name="respuesta" value="NO" id="no">
                            <div class="opcion-box">
                                <div class="cuadrado-indicador"></div>
                                <span class="opcion-texto">No</span>
                            </div>
                        </label>
                    </div>

                    <div class="d-flex justify-content-between mt-5">
                        <!-- Espacio para el botón Anterior (se coloca fuera) -->
                        <span></span>

                        <button type="submit" class="btn btn-primary" th:if="${!esUltimaPregunta}">
                            Siguiente →
                        </button>
                        <button type="submit" class="btn btn-success" th:if="${esUltimaPregunta}">
                            Finalizar Test
                        </button>
                    </div>
                </form>

                <!-- FORMULARIO PARA ANTERIOR: independiente, solo visible si no es la primera pregunta -->
                <form th:if="${progreso > 1}" th:action="@{/realizar-test/anterior}" method="post"
                      style="margin-top: -68px; width: fit-content;"
                      onsubmit="this.querySelector('button').disabled = true;">
                    <button type="submit" class="btn btn-secondary">← Anterior</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
