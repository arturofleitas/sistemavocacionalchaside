<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Realizar Test - CHASIDE</title>
	<link rel="stylesheet" th:href="@{/css/home.css}">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<style>
		.content {
			background: linear-gradient(135deg, #f0f7ff 0%, #e0f0ff 100%);
			min-height: 100vh;
			padding: 30px;
		}

		.question-card {
			background: white;
			border-radius: 20px;
			box-shadow: 0 10px 30px rgba(13, 110, 253, 0.15);
			padding: 40px;
		}

		.progress {
			height: 12px;
		}

		.opciones-container {
			display: flex;
			justify-content: center;
			gap: 30px;
			margin: 45px 0;
		}

		.opcion-card {
			cursor: pointer;
			width: 180px;
			height: 140px;
		}


		.opcion-card input[type="radio"] {
			display: none;
		}

		/* Caja contenedora de la tarjeta */
		.opcion-box {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
			border: 2px solid #dee2e6;
			border-radius: 16px;
			background-color: #ffffff;
			transition: all 0.2s ease-in-out;
			gap: 15px;
		}

		/* Texto de la opcion (Sí / No) */
		.opcion-texto {
			font-weight: 700;
			font-size: 1.4rem;
			color: #495057;
		}

		/* Campo indicador cuadrado grande */
		.cuadrado-indicador {
			width: 26px;
			height: 26px;
			border: 2px solid #adb5bd;
			border-radius: 6px;
			transition: all 0.2s ease;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		/* Efecto Hover al pasar por encima */
		.opcion-card:hover .opcion-box {
			border-color: #0d6efd;
			background-color: #f8f9fa;
		}

		/* Estilos cuando la opcion esta Seleccionada (Checked) */
		.opcion-card input[type="radio"]:checked+.opcion-box {
			border-color: #0d6efd;
			background-color: #ecf3ff;
			box-shadow: 0 8px 20px rgba(13, 110, 253, 0.15);
		}

		.opcion-card input[type="radio"]:checked+.opcion-box .cuadrado-indicador {
			background-color: #0d6efd;
			border-color: #0d6efd;
		}

		/* Checkmark blanco dentro del cuadrado azul cuando se selecciona */
		.opcion-card input[type="radio"]:checked+.opcion-box .cuadrado-indicador::after {
			content: "\f00c";
			font-family: "Font Awesome 6 Free";
			font-weight: 900;
			color: #ffffff;
			font-size: 14px;
		}

		.opcion-card input[type="radio"]:checked+.opcion-box .opcion-texto {
			color: #0d6efd;
		}
	</style>
</head>

<body>
	<div class="main-container">
		<!-- Sidebar -->
		<div class="sidebar">
			<div class="sidebar-header">
				<h4><i class="fas fa-clipboard-check"></i> Sistema Vocacional</h4>
			</div>
			<ul class="nav flex-column">
				<li><a th:href="@{/home}"><i class="fas fa-home"></i> Inicio</a></li>
				<li sec:authorize="hasRole('ADMIN')">
					<a th:href="@{/usuarios}"><i class="fas fa-users"></i> Usuarios</a>
				</li>
				<li sec:authorize="hasRole('ADMIN')">
					<a th:href="@{/gestion-test}"><i class="fas fa-cogs"></i> Gestión de Test</a>
				</li>
				<li sec:authorize="hasRole('ADMIN')">
					<a th:href="@{/preguntas}"><i class="fas fa-question-circle"></i> Preguntas</a>
				</li>
				<li sec:authorize="hasAnyRole('ADMIN', 'ESTUDIANTE')">
					<a th:href="@{/realizar-test}" class="active"><i class="fas fa-play-circle"></i> Realizar Test</a>
				</li>
				<li sec:authorize="hasAnyRole('ADMIN','ESTUDIANTE')">
					<a th:href="@{/reportes}"><i class="fas fa-chart-bar"></i> Reportes</a>
				</li>
				<li class="mt-auto">
					<a href="/logout"><i class="fas fa-sign-out-alt"></i> Salir</a>
				</li>
			</ul>
		</div>

		<!-- Contenido del Test -->
		<div class="content">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h2 class="header-title">Realizar Test Vocacional CHASIDE</h2>
				<div class="user-info">
					<span>Bienvenido</span>
				</div>
			</div>

			<!-- Barra de progreso -->
			<div class="mb-4">
				<div class="d-flex justify-content-between mb-1">
					<span>Pregunta <strong th:text="${progreso}"></strong> de <strong
							th:text="${total}"></strong></span>
					<span th:text="${progreso * 100 / total} + '%'"></span>
				</div>
				<div class="progress">
					<div class="progress-bar bg-primary" th:style="'width: ' + (${progreso} * 100 / ${total}) + '%'">
					</div>
				</div>
			</div>

			<div class="question-card">
				<h4 th:text="${pregunta.texto}"></h4>

				<!-- FORMULARIO PRINCIPAL: Siguiente / Finalizar -->
				<form th:action="@{/realizar-test/responder}" method="post" class="mt-4"
					onsubmit="this.querySelector('button[type=submit]').disabled = true; return true;">

					<!--  Opciones grandes, centradas y cuadradas -->
					<div class="opciones-container">
						<!-- Opción Sí -->
						<label class="opcion-card">
							<input type="radio" name="respuesta" value="SI" id="si" required>
							<div class="opcion-box">
								<div class="cuadrado-indicador"></div>
								<span class="opcion-texto">Sí</span>
							</div>
						</label>

						<!-- Opción No -->
						<label class="opcion-card">
							<input type="radio" name="respuesta" value="NO" id="no">
							<div class="opcion-box">
								<div class="cuadrado-indicador"></div>
								<span class="opcion-texto">No</span>
							</div>
						</label>
					</div>

					<div class="d-flex justify-content-between mt-5">
						<!-- Espacio para el botón Anterior (se colocará fuera de este formulario) -->
						<span></span>

						<button type="submit" class="btn btn-primary" th:if="${!esUltimaPregunta}">
							Siguiente →
						</button>
						<button type="submit" class="btn btn-success" th:if="${esUltimaPregunta}">
							Finalizar Test
						</button>
					</div>
				</form>

				<!-- FORMULARIO PARA ANTERIOR: independiente, solo visible si no es la primera pregunta -->
				<form th:if="${progreso > 1}" th:action="@{/realizar-test/anterior}" method="post"
					style="margin-top: -68px; width: fit-content;"
					onsubmit="this.querySelector('button').disabled = true;">
					<button type="submit" class="btn btn-secondary">← Anterior</button>
				</form>
			</div>
		</div>
	</div>
</body>

</html>
