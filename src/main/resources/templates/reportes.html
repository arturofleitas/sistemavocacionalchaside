<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Sistema Vocacional</title>

    <!-- Estilos globales y específicos -->
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/reportes.css}">
</head>
<body>
    <div class="main-container">

        <!-- Menú lateral (sidebar) reutilizado desde fragmentos -->
        <div th:replace="~{fragments/menu :: sidebar}"></div>

        <!-- Contenido principal -->
        <div class="content">

            <!-- Encabezado con botón hamburguesa y datos del usuario -->
            <!-- Clase "no-print" agregada: al imprimir, este bloque completo (título, ícono
                 hamburguesa y "Bienvenido, X") no debe salir; solo debe verse el encabezado
                 "Historial de evaluaciones" y la tabla de resultados. -->
            <div class="header no-print">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="btn btn-primary d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <button class="btn-toggle-sidebar d-none d-md-inline-block" type="button" title="Mostrar/ocultar menú">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 class="header-title"><i class="fas fa-chart-line me-2"></i>Reportes y Estadísticas</h2>
                </div>
                <div class="d-flex gap-3 align-items-center">
                    <button id="btnImprimir" type="button" class="btn btn-outline-primary btn-imprimir">
                        <i class="fas fa-print me-1"></i>Imprimir Reporte
                    </button>
                    <div th:replace="~{fragments/menu :: userInfo}"></div>
                </div>
            </div>

            <!-- Offcanvas para móvil (menú desplegable) -->
            <div th:replace="~{fragments/menu :: offcanvas}"></div>

            <!-- Mensajes flash (errores / avisos) -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show no-print" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show no-print" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Barra de filtros (misma estructura para ambos roles, solo cambia si se ve "Filtrar por alumno") -->
            <div class="filter-bar no-print" id="filtrosReportes">
                <div class="row g-2 g-md-3 align-items-end">
                    <!-- Filtro por alumno (solo administradores) -->
                    <div class="col-md-4" th:if="${rol == 'ADMIN'}">
                        <label for="filtroNombre" class="form-label">Filtrar por alumno</label>
                        <input type="text" id="filtroNombre" class="form-control" placeholder="Ej: Juan Pérez">
                    </div>
                    <!-- Filtro fecha desde -->
                    <div class="col-6 col-md-3" th:classappend="${rol == 'ESTUDIANTE'} ? 'col-md-4' : ''">
                        <label for="filtroFechaDesde" class="form-label">Fecha desde</label>
                        <input type="date" id="filtroFechaDesde" class="form-control">
                    </div>
                    <!-- Filtro fecha hasta -->
                    <div class="col-6 col-md-3" th:classappend="${rol == 'ESTUDIANTE'} ? 'col-md-4' : ''">
                        <label for="filtroFechaHasta" class="form-label">Fecha hasta</label>
                        <input type="date" id="filtroFechaHasta" class="form-control">
                    </div>
                    <!-- Botón limpiar -->
                    <div class="col-12 col-md-2" th:classappend="${rol == 'ESTUDIANTE'} ? 'col-md-4' : ''">
                        <button id="limpiarFiltros" class="btn btn-outline-secondary w-100">Limpiar</button>
                    </div>
                </div>
            </div>

            <!-- Mensaje informativo (solo estudiante) -->
            <div class="alert alert-info no-print" th:if="${rol == 'ESTUDIANTE'}">
                <i class="fas fa-info-circle"></i> <strong>Aquí puedes ver tus evaluaciones realizadas.</strong>
                <br>Selecciona una para ver el detalle de tus respuestas.
            </div>

            <!--
                Estado vacío exclusivo del estudiante (invita a realizar el primer test).
                El admin, si no hay resultados, simplemente ve la fila "No se encontraron
                evaluaciones." dentro de la tabla (ver más abajo), por lo que este bloque
                solo aplica cuando el rol es ESTUDIANTE.
            -->
            <div th:if="${rol == 'ESTUDIANTE' and (resultados == null || resultados.isEmpty())}"
                 class="text-center p-5 bg-light rounded-4">
                <i class="fas fa-clipboard-list fa-4x text-muted mb-3"></i>
                <h4>Aún no has realizado ningún test</h4>
                <a th:href="@{/realizar-test}" class="btn btn-primary">Iniciar test ahora</a>
            </div>

            <!--
                TABLA ÚNICA de historial de evaluaciones, usada tanto por ADMIN como por ESTUDIANTE.
                Se oculta completamente cuando el estudiante no tiene resultados (ya se mostró
                el estado vacío arriba). Para el admin siempre se muestra (aunque esté vacía,
                muestra el mensaje "No se encontraron evaluaciones." dentro del tbody).
            -->
            <div class="table-responsive-custom"
                 th:if="${rol == 'ADMIN' || !(resultados == null || resultados.isEmpty())}">
                <h5 class="mb-3"><i class="fas fa-history me-2"></i>Historial de evaluaciones</h5>
                <div style="max-height: 500px; overflow-y: auto;" id="scrollableTable">
                    <!--
                        La clase "tabla-admin" / "tabla-estudiante" en la tabla permite que el CSS
                        (reportes.css) afine el ancho de columnas de forma distinta según el rol,
                        sobre todo en mobile, sin duplicar HTML.
                    -->
                    <table class="table table-hover"
                           id="tablaReportes"
                           th:classappend="${rol == 'ADMIN'} ? 'tabla-admin' : 'tabla-estudiante'">
                        <thead class="table-light sticky-top">
                            <tr>
                                <!-- Columna de numeración correlativa (1, 2, 3...), igual para ambos roles -->
                                <th class="col-index">#</th>
                                <!-- Columna "Alumno" solo tiene sentido para el admin -->
                                <th class="col-alumno" th:if="${rol == 'ADMIN'}">Alumno</th>
                                <th class="col-fecha">Fecha</th>
                                <th class="col-perfil">Perfil</th>
                                <!--
                                    Puntaje: en desktop se muestra siempre (hay espacio de sobra).
                                    En mobile, se oculta SOLO para admin (ver reportes.css, regla
                                    .tabla-admin .col-puntaje), porque ahí el espacio lo necesita
                                    la columna Alumno. Para estudiante, en mobile, sí se ve.
                                -->
                                <th class="col-puntaje">Puntaje</th>
                                <th class="col-detalle">Detalle</th>
                            </tr>
                        </thead>
                        <tbody id="tablaReportesBody">
                            <!-- Fila de "sin datos" -->
                            <tr th:if="${resultados == null || resultados.isEmpty()}">
                                <td th:attr="colspan=${rol == 'ADMIN'} ? 6 : 5" class="text-center text-muted">
                                    No se encontraron evaluaciones.
                                </td>
                            </tr>
                            <!--
                                Fila de datos. Los atributos data-nombre y data-fecha se agregan
                                siempre (los use el admin para filtrar o no), ya que no afectan
                                al estudiante y así reportes.js funciona igual para ambos roles.
                            -->
                            <!--
                                Se agrega la variable de iteración "iterStat" (propia de Thymeleaf)
                                para poder numerar las filas de forma correlativa con iterStat.count,
                                sin depender de ningún campo de la base de datos.
                            -->
                            <tr th:each="res, iterStat : ${resultados}"
                                th:attr="data-nombre=${res.test.usuario.nombre + ' ' + res.test.usuario.apellido},
                                         data-fecha=${res.fechaRealizacion}">
                                <td class="col-index" th:text="${iterStat.count}">1</td>
                                <td class="col-alumno" th:if="${rol == 'ADMIN'}" th:text="${res.test.usuario.nombre + ' ' + res.test.usuario.apellido}">-</td>
                                <td class="col-fecha" th:text="${#temporals.format(res.fechaRealizacion, 'dd/MM/yyyy')}">-</td>
                                <td class="col-perfil" th:text="${res.getNombrePerfil()}">-</td>
                                <td class="col-puntaje" th:text="${res.puntaje}">-</td>
                                <td class="col-detalle">
                                    <a th:href="@{/reportes-detalles/test/{id}(id=${res.id})}" class="btn btn-sm btn-info">
                                        <!-- El texto "Ver" se oculta en pantallas muy angostas (< 576px), dejando solo el ícono, para ahorrar espacio -->
                                        <i class="fas fa-eye"></i> <span class="d-none d-sm-inline">Ver</span>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div><!-- /content -->
    </div><!-- /main-container -->

    <!-- Botón flotante para ir hacia arriba (solo visible en móvil) -->
    <button id="btnSubir" class="btn-flotante d-md-none" title="Volver arriba">
        <i class="fas fa-chevron-up"></i>
    </button>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/sidebar.js}"></script>
    <script th:src="@{/js/reportes.js}"></script>
</body>
</html>
