<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Preguntas - Sistema Vocacional</title>

    <!-- Meta tags anti-caché -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- 1. Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">

    <!-- 2. Font Awesome -->
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" 
          referrerpolicy="no-referrer" />

    <!-- 3. home.css (estilos globales) -->
    <link rel="stylesheet" th:href="@{/css/home.css} + '?v=' + ${#dates.createNow().getTime()}">

    <!-- 4. preguntas.css (estilos específicos de esta página) -->
    <link rel="stylesheet" th:href="@{/css/preguntas.css} + '?v=' + ${#dates.createNow().getTime()}">
</head>

<body>
    <div class="main-container">

        <!-- ===== SIDEBAR (escritorio) ===== -->
        <div th:replace="~{fragments/menu :: sidebar}"></div>

        <!-- ===== CONTENIDO PRINCIPAL ===== -->
        <div class="content">

            <!-- HEADER -->
            <div class="header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="btn btn-primary d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 class="header-title">Gestión de Preguntas</h2>
                </div>
                <div class="user-info">
                    <span>Bienvenido, <span sec:authentication="name"></span></span>
                </div>
            </div>

            <!-- ===== OFFCANVAS (móvil) ===== -->
            <div th:replace="~{fragments/menu :: offcanvas}"></div>

            <!-- ===== MENSAJE DE ERROR ===== -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong><i class="fas fa-exclamation-triangle"></i> Error:</strong> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- ===== CONTENIDO (formulario + tabla) ===== -->
            <div class="row g-4">
                <!-- COLUMNA IZQUIERDA: Formulario -->
                <div class="col-lg-5 columna-formulario-izquierda no-print">
                    <div class="form-card p-4">
                        <h5 class="mb-4 text-primary" th:if="${pregunta.id == null || pregunta.id == 0}">Nueva Pregunta</h5>
                        <h5 class="mb-4 text-primary" th:if="${pregunta.id != null && pregunta.id > 0}">Editar Pregunta</h5>

                        <form th:action="@{/preguntas/guardar}" th:object="${pregunta}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <!-- Selector del Test -->
                            <div class="mb-3">
                                <label class="form-label">Test al que pertenece</label>
                                <select class="form-select" th:field="*{test}" required>
                                    <option value="">-- Seleccione un Test --</option>
                                    <option th:each="t : ${tests}" th:value="${t.id}" th:text="${t.nombre}"></option>
                                </select>
                            </div>

                            <!-- Número de Pregunta -->
                            <div class="mb-3">
                                <label class="form-label">Número de Pregunta (1-98)</label>
                                <input type="number" class="form-control" th:field="*{numero}" min="1" max="98" required>
                                <small class="text-muted">Debe ser único y no repetido.</small>
                            </div>

                            <!-- Texto de la pregunta -->
                            <div class="mb-3">
                                <label class="form-label">Texto de la Pregunta</label>
                                <textarea class="form-control" rows="4" th:field="*{texto}" required></textarea>
                            </div>

                            <!-- Categoría -->
                            <div class="mb-3">
                                <label class="form-label">Categoría (C H A S I D E)</label>
                                <select class="form-select" th:field="*{categoria}" required>
                                    <option value="C">C - Administrativas y Contables</option>
                                    <option value="H">H - Humanísticas, Jurídicas y Sociales</option>
                                    <option value="A">A - Artísticas</option>
                                    <option value="S">S - Ciencias de la Salud</option>
                                    <option value="I">I - Ingenierías, Técnicas y Computación</option>
                                    <option value="D">D - Defensa y Seguridad</option>
                                    <option value="E">E - Ciencias Agrarias, Naturales y Biológicas</option>
                                </select>
                            </div>

                            <!-- Dimensión -->
                            <div class="mb-3">
                                <label class="form-label">Dimensión (Interés o Aptitud)</label>
                                <select class="form-select" th:field="*{dimension}" required>
                                    <option value="">-- Seleccione --</option>
                                    <option value="INTERES">INTERES</option>
                                    <option value="APTITUD">APTITUD</option>
                                </select>
                            </div>

                            <!-- Botones -->
                            <div class="d-flex gap-3">
                                <button type="button" class="btn btn-secondary flex-fill" onclick="window.location.href='/preguntas'">Cancelar</button>
                                <button type="submit" class="btn btn-primary flex-fill">Guardar Pregunta</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- COLUMNA DERECHA: Tabla -->
                <div class="col-lg-7 columna-tabla-derecha">
                    <div class="table-card">
                        <div class="p-4 border-bottom bg-light d-flex justify-content-between align-items-center cabecera-tabla">
                            <h5 class="mb-0 text-primary titulo-tabla">Preguntas Registradas</h5>
                            <div class="d-flex gap-2 no-print">
                                <button onclick="window.print();" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-print me-1"></i>Imprimir
                                </button>
                                <a th:href="@{/preguntas}" class="btn btn-sm btn-primary">
                                    <i class="fas fa-plus"></i> Nueva Pregunta
                                </a>
                            </div>
                        </div>

                        <!-- BARRA DE FILTROS -->
                        <div class="filter-bar no-print">
                            <div class="row g-3 align-items-end">
                                <div class="col-md-3">
                                    <label for="searchText" class="form-label">Buscar en pregunta</label>
                                    <input type="text" id="searchText" class="form-control" placeholder="Ej: contabilidad...">
                                </div>
                                <div class="col-md-2">
                                    <label for="filterNumero" class="form-label">N° Pregunta</label>
                                    <input type="number" id="filterNumero" class="form-control" placeholder="Ej: 34" min="1" max="98">
                                </div>
                                <div class="col-md-2">
                                    <label for="filterCategoria" class="form-label">Categoría</label>
                                    <select id="filterCategoria" class="form-select">
                                        <option value="">Todas</option>
                                        <option value="C">C</option>
                                        <option value="H">H</option>
                                        <option value="A">A</option>
                                        <option value="S">S</option>
                                        <option value="I">I</option>
                                        <option value="D">D</option>
                                        <option value="E">E</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="filterTest" class="form-label">Test</label>
                                    <select id="filterTest" class="form-select">
                                        <option value="">Todos</option>
                                        <option th:each="t : ${tests}" th:value="${t.id}" th:text="${t.nombre}"></option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <button id="resetFilters" class="btn btn-outline-secondary w-100">Limpiar</button>
                                </div>
                            </div>
                        </div>

                        <!-- TABLA -->
                        <div class="scrollable-table">
                            <table class="table table-hover mb-0" id="preguntasTable">
                                <thead class="table-light" style="position: sticky; top: 0; z-index: 1;">
                                    <tr>
                                        <th>N°</th>
                                        <th>Test</th>
                                        <th>Pregunta</th>
                                        <th>Categoría</th>
                                        <th class="text-center columna-acciones no-print">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="preguntasBody">
                                    <tr th:if="${preguntas.isEmpty()}">
                                        <td colspan="5" class="text-center py-5 text-muted">
                                            <i class="fas fa-inbox fa-3x mb-3"></i><br>
                                            Aún no hay preguntas registradas.<br>
                                            <small>Utiliza el formulario de la izquierda para agregar la primera.</small>
                                        </td>
                                    </tr>
                                    <tr th:each="p : ${preguntas}" 
                                        th:attr="data-test-id=${p.test?.id}, 
                                                 data-categoria=${p.categoria},
                                                 data-numero=${p.numero}">
                                        <td th:text="${p.numero}"></td>
                                        <td th:text="${p.test?.nombre} ?: 'Sin asignar'"></td>
                                        <td class="pregunta-texto" th:text="${p.texto}"></td>
                                        <td><span class="badge bg-primary text-badge-categoria" th:text="${p.categoria}"></span></td>
                                        <td class="text-center columna-acciones no-print">
                                            <a th:href="@{/preguntas/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary me-2">
                                                <i class="fas fa-edit"></i> Editar
                                            </a>
                                            <a th:href="@{/preguntas/eliminar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar esta pregunta?')">Eliminar</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/preguntas.js}"></script>
</body>

</html>
