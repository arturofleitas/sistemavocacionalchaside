<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Evaluación - CHASIDE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/detalle-test.css}">
</head>
<body>
<div class="container mt-4" id="topo">

    <!-- ENCABEZADO -->
    <div class="report-header d-flex justify-content-between align-items-center flex-wrap">
        <div>
            <h2 class="fw-bold text-primary mb-1"><i class="fas fa-file-invoice me-2"></i>Detalle de la Evaluación</h2>
            <p class="text-muted mb-0">Test de Orientación Vocacional CHASIDE</p>
        </div>
        <div class="no-print d-flex gap-2">
            <button onclick="window.print();" class="btn btn-primary btn-lg-custom">
                <i class="fas fa-print me-2"></i>Imprimir
            </button>
            <a href="/reportes" class="btn btn-outline-secondary btn-lg-custom">
                <i class="fas fa-arrow-left me-2"></i>Volver
            </a>
        </div>
    </div>

    <!-- INFORMACIÓN DEL USUARIO Y PERFIL -->
    <div class="info-card">
        <div class="row">
            <div class="col-md-6">
                <strong>Alumno</strong><br>
                <span th:text="${alumnoNombre}">-</span>
            </div>
            <div class="col-md-6">
                <strong>Fecha de realización</strong><br>
                <span th:text="${resultado.fechaFormateada}">-</span>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-6">
                <strong>Perfil Recomendado</strong><br>
                <span class="badge-perfil" th:text="${perfilRecomendado}">-</span>
            </div>
            <div class="col-md-6">
                <strong>Puntaje de afinidad</strong><br>
                <span class="text-success" th:text="${resultado.puntaje} + ' aciertos'">-</span>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-6">
                <strong><i class="fas fa-heart text-primary me-1"></i>Intereses</strong><br>
                <span th:text="${interesesNombres}">-</span>
            </div>
            <div class="col-md-6">
                <strong><i class="fas fa-brain text-success me-1"></i>Aptitudes</strong><br>
                <span th:text="${aptitudesNombres}">-</span>
            </div>
        </div>
    </div>

    <!-- TABLA DE RESPUESTAS -->
    <div class="table-reporte mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold text-secondary mb-0"><i class="fas fa-list-ol me-2"></i>Respuestas por pregunta</h5>
            <span class="badge bg-light text-muted" th:text="${preguntas.size()} + ' preguntas'"></span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th style="width:8%; text-align:center;">#</th>
                        <th style="width:77%;">Pregunta</th>
                        <th style="width:15%; text-align:center;">Respuesta</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tup, stat : ${preguntas}">
                        <td style="text-align:center;" th:text="${stat.count}">1</td>
                        <td th:text="${tup.pregunta != null && tup.pregunta.texto != null ? tup.pregunta.texto : 'Pregunta no disponible'}">Texto de la pregunta</td>
                        <td style="text-align:center;">
                            <span th:with="res=${tup.pregunta != null ? mapaRespuestas[tup.pregunta.id] : null}"
                                  th:text="${res ?: 'Sin respuesta'}"
                                  th:class="${res == 'Sí' ? 'badge-si' : 'badge-no'}">Sí</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- BOTÓN FLOTANTE -->
<div class="scroll-top-btn no-print" id="scrollTopBtn">
    <a href="#topo" class="btn btn-primary btn-lg rounded-circle shadow" title="Volver arriba">
        <i class="fas fa-chevron-up"></i>
    </a>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('scrollTopBtn');
        var tabla = document.querySelector('.table-reporte');
        var triggerY = 0;

        // El botón aparece al llegar a la pregunta 20 (aprox.) de la tabla
        if (tabla) {
            var filas = tabla.querySelectorAll('tbody tr');
            var fila20 = filas[19];
            var rect = fila20 ? fila20.getBoundingClientRect() : tabla.getBoundingClientRect();
            triggerY = rect.top + window.scrollY + (fila20 ? rect.height : 600);
        }

        function actualizar() {
            btn.style.display = (window.scrollY >= triggerY) ? 'block' : 'none';
        }

        window.addEventListener('scroll', actualizar);
        actualizar();
    });
</script>

</body>
</html>
