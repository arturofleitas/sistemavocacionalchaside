<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Test Vocacional</title>
    <!-- Bootstrap 5 para estructura base ágil -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- FontAwesome para los íconos visuales -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Enlace al archivo CSS separado -->
    <link rel="stylesheet" th:href="@{/css/detalle-test.css}">
</head>
<body>
<div class="container mt-5">
    
    <!-- Encabezado del Informe -->
    <div class="report-header d-flex justify-content-between align-items-end pb-3">
        <div>
            <h2 class="fw-bold text-primary mb-1"><i class="fas fa-file-invoice me-2"></i>Detalle de la Evaluación</h2>
            <p class="text-muted mb-0">Sistema de Orientación Vocacional - Test CHASIDE</p>
        </div>
        
        <!-- Botones de Acción Agrandados con la clase btn-lg-custom (no-print los remueve al imprimir) -->
        <div class="no-print mb-1">
            <button onclick="window.print();" class="btn btn-primary btn-lg-custom me-2">
                <i class="fas fa-print me-2"></i>Imprimir Reporte
            </button>
            <a href="/reportes" class="btn btn-outline-secondary btn-lg-custom">
                <i class="fas fa-arrow-left me-2"></i>Volver
            </a>
        </div>
    </div>

    <!-- Tarjeta Informativa de Resultados -->
    <div class="info-card">
        <div class="info-grid">
            <div class="info-item">
                <strong>Nombre del Alumno</strong>
                <span th:text="${resultado.test.usuario.nombre + ' ' + resultado.test.usuario.apellido}">-</span>
            </div>
            <div class="info-item">
                <strong>Fecha de Realización</strong>
                <span th:text="${resultado.fechaFormateada}">-</span>
            </div>
            <div class="info-item mt-2">
                <strong>Perfil Vocacional Obtenido</strong>
                <span class="badge-perfil" th:text="${resultado.nombrePerfil}">-</span>
            </div>
            <div class="info-item mt-2">
                <strong>Puntaje de Afinidad (SI)</strong>
                <span class="text-success" th:text="${resultado.puntaje} + ' aciertos'">-</span>
            </div>
        </div>
    </div>

    <!-- Tabla de Respuestas con tamaño de fuente mejorado -->
    <h4 class="fw-bold mb-3 text-secondary"><i class="fas fa-list-ol me-2"></i>Respuestas por pregunta</h4>
    <div class="table-reporte mb-5">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th style="width: 8%; text-align: center;">#</th>
                    <th style="width: 77%;">Pregunta</th>
                    <th style="width: 15%; text-align: center;">Respuesta</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="tup, stat : ${preguntas}">
                    <td th:text="${stat.count}" style="text-align: center;" class="fw-bold text-secondary">?</td>
                    <td th:text="${tup.pregunta.texto}">?</td>
                    <td style="text-align: center;">
                        <!-- Mapeo condicional de clases para pintar la respuesta dinámicamente -->
                        <span th:with="res=${mapaRespuestas[tup.pregunta.id]}"
                              th:text="${res}"
                              th:class="${res == 'SI' ? 'badge-si' : 'badge-no'}">-</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
