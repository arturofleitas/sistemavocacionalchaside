<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Detalle de la evaluación</h2>
    <p><strong>Alumno:</strong> <span th:text="${resultado.test.usuario.nombre + ' ' + resultado.test.usuario.apellido}"></span></p>
    <p><strong>Fecha:</strong> <span th:text="${resultado.fechaFormateada}"></span></p>
    <p><strong>Perfil obtenido:</strong> <span th:text="${resultado.nombrePerfil}"></span></p>
    <p><strong>Puntaje (Sí en el perfil):</strong> <span th:text="${resultado.puntaje}"></span></p>

    <h4>Respuestas por pregunta</h4>
    <table class="table table-striped">
        <thead>
            <tr><th>#</th><th>Pregunta</th><th>Respuesta</th></tr>
        </thead>
        <tbody>
            <tr th:each="tup, stat : ${preguntas}">
                <td th:text="${stat.count}">?</td>
                <td th:text="${tup.pregunta.texto}">?</td>
                <td><span th:text="${mapaRespuestas[tup.pregunta.id]}">-</span></td>
            </tr>
        </tbody>
    </table>
    <a href="/reportes" class="btn btn-secondary">Volver a reportes</a>
</div>
</body>
</html>
